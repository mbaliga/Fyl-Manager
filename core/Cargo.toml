[workspace]
resolver = "2"
members = [
    "crates/fylz-types",
    "crates/fylz-archive",
    "crates/fylz-sniff",
    "crates/fylz-rename",
    "crates/fylz-query",
    "crates/fylz-index",
    "crates/fylz-verify",
    "crates/fylz-usb",
