[package]
name = "fylz-sniff-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# A cargo-fuzz project is its own workspace, deliberately not a member of the parent core/
# workspace: it needs nightly's -Z sanitizer flags (RUSTFLAGS the stable workspace must never see)
# and its own dependency resolution. Without this, Cargo walks up to core/Cargo.toml, sees this
# package isn't in its `members` list, and refuses to build at all ("current package believes
# it's in a workspace when it's not").
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fylz-sniff]
path = "../crates/fylz-sniff"

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false
