name: Release readiness

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test, lint, and build release candidate
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease

      - name: Generate release dependency graph
        run: |
          mkdir -p build/reports
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath \
            > build/reports/release-runtime-dependencies.txt

      - name: Upload unsigned release candidate
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fylz-release-candidate-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-dependencies
          path: build/reports/release-runtime-dependencies.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release lint report
        if: always() && hashFiles('app/build/reports/lint-results-release.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fylz-release-lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30
