name: Materialize Fylz source

on:
  push:
    branches:
      - agent/fylz-foundation
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive-bz2-part-* | tr -d '\r\n' | base64 --decode > /tmp/fylz-source.tar.bz2
          echo "71d713bf30f0c0ad74ac1a08ebcb9501ae9b2436cfcb845760106b9c90183ecf  /tmp/fylz-source.tar.bz2" | sha256sum --check
          mkdir -p /tmp/fylz-source
          tar -xjf /tmp/fylz-source.tar.bz2 -C /tmp/fylz-source
          cp -a /tmp/fylz-source/. .
          rm -rf .bootstrap

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build Fylz Android foundation"
          git push origin HEAD:${GITHUB_REF_NAME}
