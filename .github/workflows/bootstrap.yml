name: Bootstrap Fylz branch

on:
  push:
    branches:
      - agent/fylz-workspace-foundation
  pull_request:
    branches:
      - main
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/fylz-workspace-foundation') ||
      (github.event_name == 'issues' && github.event.issue.title == '[bootstrap] Expand Fylz source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fylz-workspace-foundation
          fetch-depth: 0
      - name: Expand project snapshot
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "bootstrap/project.part.*" > /dev/null; then
            echo "Bootstrap payload is already expanded."
            exit 0
          fi
          cat bootstrap/project.part.* > /tmp/fylz-project.tar.gz.b64
          base64 --decode /tmp/fylz-project.tar.gz.b64 > /tmp/fylz-project.tar.gz
          echo "e5d08b30c3cef0eba89323911bfa255d7f3eb5fc6181f38eb7c021e6e9fdd199  /tmp/fylz-project.tar.gz" | sha256sum --check -
          tar -tzf /tmp/fylz-project.tar.gz
          tar -xzf /tmp/fylz-project.tar.gz
          rm -f .bootstrap
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "Fylz Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build Fylz workspace foundation"
          git push origin HEAD:agent/fylz-workspace-foundation
