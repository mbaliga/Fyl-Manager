name: Bootstrap Fylz source

on:
  push:
    branches:
      - agent/fylz-v0.1-foundation
    paths:
      - .github/workflows/bootstrap.yml
      - bootstrap/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-fylz-source
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fylz-v0.1-foundation
          fetch-depth: 0

      - name: Restore reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | base64 --decode > /tmp/fylz-source.tar.gz
          echo "37a3524d0451c6da493731e0d01219354fb5a7e92d16f2f74b75bd1f87b772d5  /tmp/fylz-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/fylz-source.tar.gz --strip-components=1
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Fylz Android foundation"
          git push origin HEAD:agent/fylz-v0.1-foundation
