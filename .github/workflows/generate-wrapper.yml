name: Generate pinned Gradle wrapper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wrapper:
    if: github.head_ref == 'agent/fylz-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fylz-foundation
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate and commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          rm .github/workflows/generate-wrapper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add pinned Gradle wrapper'
          git push origin HEAD:agent/fylz-foundation
