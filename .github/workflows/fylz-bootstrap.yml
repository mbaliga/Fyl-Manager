name: Expand verified Fylz source snapshot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/fylz-workspace-foundation')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the controlled source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fylz-workspace-foundation
          fetch-depth: 0

      - name: Expand and verify the project snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/project.part.* > /tmp/fylz-project.tar.gz.b64
          base64 --decode /tmp/fylz-project.tar.gz.b64 > /tmp/fylz-project.tar.gz
          echo "e5d08b30c3cef0eba89323911bfa255d7f3eb5fc6181f38eb7c021e6e9fdd199  /tmp/fylz-project.tar.gz" | sha256sum --check -
          tar -tzf /tmp/fylz-project.tar.gz
          tar -xzf /tmp/fylz-project.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish native source files to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fylz Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build Fylz workspace foundation"
          git push origin HEAD:agent/fylz-workspace-foundation
